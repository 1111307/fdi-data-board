syntax = "proto3";

package kratos.api;

option go_package = "github.com/go-kratos/kratos-layout/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
    Server server = 1;
    Data data = 2;
}

message Server {
    message HTTP {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }
    message GRPC {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }
    message GIN {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
        string run_mode = 4;
    }

    HTTP http = 1;
    GRPC grpc = 2;
    GIN gin = 3;
}

message Data {
    message Mysql {
        string source = 1;
        int64 max_idl = 2;
        int64 max_open = 3;
        google.protobuf.Duration conn_max_lift = 4;
        string pre_source = 5;
        string db_name = 6;
    }
    message Redis {
        string addr = 2;
        google.protobuf.Duration read_timeout = 3;
        google.protobuf.Duration write_timeout = 4;
        string password = 5;
        string link_type = 6;
    }

    message Keycloak {
        string url = 1;
        string realm = 2;
        string token_tpl = 3;
    }

    message GrpcClient {
        google.protobuf.Duration timeout = 1;
        string any_endpoint = 2;
        string um_endpoint = 4;
    }

    message Doris {
        string on = 1;
        string host = 2;
        string port = 3;
        string username = 4;
        string password = 5;
        string database = 6;
        int32 max_idl = 7;
        int32 max_open = 8;
        google.protobuf.Duration conn_max_lift = 9;
        google.protobuf.Duration query_timeout = 10;
    }

    message Runtime {
        string env = 1;
        string domain = 2;
    }

    message Etl {
        bool on = 1;
        bool backfill_on = 2;
        int32 backfill_days = 3;
        int32 refresh_days = 4;
        string lock_key = 5;
        google.protobuf.Duration lock_ttl = 6;
        google.protobuf.Duration lock_refresh_interval = 7;
    }

    Mysql mysql = 1;
    Redis redis = 2;
    Keycloak keycloak = 3;
    GrpcClient grpc_client = 4;
    Runtime runtime = 7;
    Doris doris = 8;
    Etl etl = 9;
}
