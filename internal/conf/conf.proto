syntax = "proto3";

package kratos.api;

option go_package = "github.com/go-kratos/kratos-layout/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
    Server server = 1;
    Data data = 2;
}

message Server {
    message HTTP {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }
    message GRPC {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
    }
    message GIN {
        string network = 1;
        string addr = 2;
        google.protobuf.Duration timeout = 3;
        string run_mode = 4;
    }

    HTTP http = 1;
    GRPC grpc = 2;
    GIN gin = 3;
}

message Data {
    message Mysql {
        string source = 1;
        int64 max_idl = 2;
        int64 max_open = 3;
        google.protobuf.Duration conn_max_lift = 4;
        string pre_source = 5;
        string db_name = 6;
    }
    message Redis {
        string addr = 2;
        google.protobuf.Duration read_timeout = 3;
        google.protobuf.Duration write_timeout = 4;
        string password = 5;
    }

    message Keycloak {
        string url = 1;
        string realm = 2;
        string token_tpl = 3;
    }

    message GrpcClient {
        google.protobuf.Duration timeout = 1;
        string any_endpoint = 2;
        string um_endpoint = 4;
    }

    message Kafka {
        string brokers = 1;
        string fis_probe_on = 2;
    }

    message Clickhouse {
        string on = 1;
        string dsn = 2;
        int32 max_idl = 3;
        int32 max_open = 4;
        google.protobuf.Duration conn_max_lift = 5;
    }

    message Runtime {
        string env = 1;
        string domain = 2;
    }

    Mysql mysql = 1;
    Redis redis = 2;
    Keycloak keycloak = 3;
    GrpcClient grpc_client = 4;
    Kafka kafka = 5;
    Clickhouse clickhouse = 6;
    Runtime runtime = 7;
}
