server:
  http:
    addr: 0.0.0.0:8000
    timeout: 35s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 35s
  gin:
    addr: 0.0.0.0:8080
    # AI 总结 SSE 长流(thinking 模型生成 40~90s)需要更长上限;kratos Timeout 为 server 级,无法按路由豁免
    timeout: 1200s
    run_mode: ${RUN_MODE:prd}
data:
  mysql:
    db_name: prd_db
    pre_source:
      ${MYSQL_USERNAME:root}:${MYSQL_PASSWORD:FDPProdP@ss}@tcp(${MYSQL_ADDR:10.10.2.27:3306})/?charset=utf8mb4&parseTime=True&loc=Local
    source:
      ${MYSQL_USERNAME:root}:${MYSQL_PASSWORD:FDPProdP@ss}@tcp(${MYSQL_ADDR:10.10.2.27:3306})/${data.mysql.db_name}?charset=utf8mb4&parseTime=True&loc=Local
    max_idl: 10
    max_open: 100
    conn_max_lift: 3600s
  redis:
    addr: ${REDIS_ADDRS:10.10.1.182:6379,10.10.0.8:6379,10.10.1.24:6379}
    password: ${REDIS_PASSWORD:Redis-Prod-P@ss}
    read_timeout: 3s
    write_timeout: 3s
  keycloak:
    url: ${KEYCLOAK_URL:https://keycloak-prod-cla.mmtwork.com/}
    realm: ${KEYCLOAK_REALM:momenta-dev}
    token_tpl: ${KEYCLOAK_URL:https://keycloak-prod-cla.mmtwork.com/}auth/realms/${KEYCLOAK_REALM:momenta-dev}/protocol/openid-connect/token
  grpc_client:
    timeout: 5s
    um_endpoint: ${UM_ENDPOINT:fdi-user-manager-backend.fdi.svc.cluster.local:9000}
    any_endpoint: 127.0.0.1:9000
  doris:
    on: ${DORIS_ON:true}
    host: ${DORIS_HOST:10.18.77.243}
    port: ${DORIS_PORT:9030}
    username: ${DORIS_USERNAME:dataInfra_read}
    password: ${DORIS_PASSWORD:dataInfra_read@@20260709}
    database: ${DORIS_DATABASE:fdi}
    query_timeout: 120s
    max_idl: 10
    max_open: 50
    conn_max_lift: 3600s
  runtime:
    env: ${RUN_MODE:prd}
    domain: ${FUNC_SCOPE:fdi_cloud}
  llm:
    # Anthropic Messages 协议网关;三项任一为空则 AI 总结退化为本地统计模式
    base_url: ${LLM_BASE_URL:https://llm-gateway.momenta.works}
    api_key: ${LLM_API_KEY:sk-Mwj6z4orGxezS5ZBADXzgQ}
    model: ${LLM_MODEL:glm-5.3-flash}
    max_tokens: ${LLM_MAX_TOKENS:16384}
    timeout: ${LLM_TIMEOUT:360s}
  fom:
    host: ${FOM_HOST:https://filterscript-api.momenta.works}
  ffm:
    url: ${FFM_URL:https://fdi.momenta.works/fm}
  etl:
    on: ${ETL_ON:true}
    backfill_on: ${ETL_BACKFILL_ON:true}
    backfill_days: ${ETL_BACKFILL_DAYS:180}
    refresh_days: ${ETL_REFRESH_DAYS:7}
    lock_key: ${ETL_LOCK_KEY:fdi_data_board:etl:scheduler}
    lock_ttl: ${ETL_LOCK_TTL:120s}
    lock_refresh_interval: ${ETL_LOCK_REFRESH_INTERVAL:30s}
  feishu:
    webhook_url: ${FEISHU_WEBHOOK_URL:https://open.feishu.cn/open-apis/bot/v2/hook/c3f49363-67bb-421f-966c-a7bcf132c104}
