syntax = "proto3";

package api.query_scene;

option go_package = "fdi_data_board/api/query_scene;query_scene_api";

// ==================== 通用响应 ====================

message BaseResponse {
    int32 code = 1;
    string message = 2;
}

// ==================== 场景列表 ====================

message ListScenesRequest {
    string category = 1; // @gotags: form:"category"
    int32 status = 2;    // @gotags: form:"status"
    int32 is_home = 3;   // @gotags: form:"is_home"
    uint64 group_id = 4; // @gotags: form:"group_id"  // >0 只返回该场景集的场景
}

message SceneIDRequest {
    uint64 scene_id = 1; // @gotags: form:"scene_id"
}

message SceneItem {
    uint64 id = 1;
    string name = 2;
    string description = 3;
    string category = 4;
    int32 status = 5;
    int32 sort_order = 6;
    string created_by = 7;
    int64 created_at = 8;
    uint64 datasource_id = 9;
    string datasource_name = 10;
    int32 is_home = 11;
    uint64 group_id = 12;
}

message ListScenesResponse {
    int32 code = 1;
    string message = 2;
    repeated SceneItem list = 3;
}

// ==================== 场景详情 ====================

message SceneParamItem {
    uint64 id = 1;
    string key_name = 2;
    string label = 3;
    string param_type = 4;
    int32 required = 5;
    string default_val = 6;
    string options = 7;
    string depends_on = 8;
    int32 sort_order = 9;
}

message SceneWidgetItem {
    uint64 id = 1;
    string title = 2;
    string sql_template = 3;
    string display_type = 4;
    string result_config = 5;
    int32 max_rows = 6;
    int32 timeout_sec = 7;
    int32 sort_order = 8;
}

message GetSceneDetailResponse {
    int32 code = 1;
    string message = 2;
    SceneItem scene = 3;
    repeated SceneParamItem params = 4;
    repeated SceneWidgetItem widgets = 5;
}

// ==================== 执行场景 ====================

message ExecuteSceneRequest {
    uint64 scene_id = 1;
    map<string, string> params = 2;
}

message WidgetResult {
    uint64 widget_id = 1;
    string title = 2;
    string display_type = 3;
    string result_config = 4;
    repeated string columns = 5;
    repeated string rows_json = 6; // 每行序列化为 JSON string
    int32 total = 7;
    string error = 8;
}

message ExecuteSceneResponse {
    int32 code = 1;
    string message = 2;
    repeated WidgetResult widgets = 3;
}

// ==================== 创建场景 ====================

message CreateSceneRequest {
    string name = 1;
    string description = 2;
    string category = 3;
    int32 status = 4;
    int32 sort_order = 5;
    repeated SceneParamItem params = 6;
    repeated SceneWidgetItem widgets = 7;
    uint64 datasource_id = 8;
    int32 is_home = 9;
    uint64 group_id = 10;
}

message CreateSceneResponse {
    int32 code = 1;
    string message = 2;
    uint64 scene_id = 3;
}

// ==================== 更新场景 ====================

message UpdateSceneRequest {
    uint64 scene_id = 1;
    optional string name = 2;
    optional string description = 3;
    optional string category = 4;
    optional int32 status = 5;
    optional int32 sort_order = 6;
    optional uint64 datasource_id = 9;
    optional int32 is_home = 10;
    optional uint64 group_id = 11;
    repeated SceneParamItem params = 7;
    repeated SceneWidgetItem widgets = 8;
}

// ==================== 参数 CRU ====================

message ListParamsRequest {
    uint64 scene_id = 1; // @gotags: form:"scene_id"
}

message ListParamsResponse {
    int32 code = 1;
    string message = 2;
    repeated SceneParamItem list = 3;
}

message CreateParamRequest {
    uint64 scene_id = 1;
    string key_name = 2;
    string label = 3;
    string param_type = 4;
    int32 required = 5;
    string default_val = 6;
    string options = 7;
    string depends_on = 8;
    int32 sort_order = 9;
}

message CreateParamResponse {
    int32 code = 1;
    string message = 2;
    uint64 param_id = 3;
}

message UpdateParamRequest {
    uint64 param_id = 1;
    optional string key_name = 2;
    optional string label = 3;
    optional string param_type = 4;
    optional int32 required = 5;
    optional string default_val = 6;
    optional string options = 7;
    optional string depends_on = 8;
    optional int32 sort_order = 9;
}

// ==================== 组件 CRU ====================

message ListWidgetsRequest {
    uint64 scene_id = 1; // @gotags: form:"scene_id"
}

message ListWidgetsResponse {
    int32 code = 1;
    string message = 2;
    repeated SceneWidgetItem list = 3;
}

message SaveWidgetRequest {
    uint64 widget_id = 1;  // 更新时传，创建时为 0
    uint64 scene_id = 2;   // 创建时必传
    string title = 3;
    string sql_template = 4;
    string display_type = 5;
    string result_config = 6;
    int32 max_rows = 7;
    int32 timeout_sec = 8;
    int32 sort_order = 9;
}

// ==================== 预览 Widget ====================

message PreviewWidgetRequest {
    uint64 scene_id = 1;
    SceneWidgetItem widget = 2;
    map<string, string> params = 3;
}

message QueryResultResponse {
    int32 code = 1;
    string message = 2;
    repeated string columns = 3;
    repeated string rows_json = 4;
    int32 total = 5;
}

// ==================== 数据源管理 ====================

message DatasourceItem {
    uint64 id = 1;
    string name = 2;
    string description = 3;
    string ds_type = 4;
    string host = 5;
    string port = 6;
    string username = 7;
    string database_name = 8;
    int32 max_idl = 9;
    int32 max_open = 10;
    int32 status = 11;
    int64 create_time = 12;
}

message ListDatasourcesResponse {
    int32 code = 1;
    string message = 2;
    repeated DatasourceItem list = 3;
}

message CreateDatasourceRequest {
    string name = 1;
    string description = 2;
    string ds_type = 3;   // doris / mysql
    string host = 4;
    string port = 5;
    string username = 6;
    string password = 7;
    string database_name = 8;
    int32 max_idl = 9;
    int32 max_open = 10;
}

message CreateDatasourceResponse {
    int32 code = 1;
    string message = 2;
    uint64 datasource_id = 3;
}

message UpdateDatasourceRequest {
    uint64 datasource_id = 1;
    optional string name = 2;
    optional string description = 3;
    optional string host = 4;
    optional string port = 5;
    optional string username = 6;
    optional string password = 7;
    optional string database_name = 8;
    optional int32 max_idl = 9;
    optional int32 max_open = 10;
    optional int32 status = 11;
}

message DatasourceIDRequest {
    uint64 datasource_id = 1;
}

// ==================== Schema 浏览 ====================

message SchemaTablesRequest {
    uint64 datasource_id = 1;
}

message SchemaTablesResponse {
    int32 code = 1;
    string message = 2;
    repeated string tables = 3;
}

message SchemaColumnsRequest {
    uint64 datasource_id = 1;
    string table_name = 2;
}

message ColumnInfo {
    string field = 1;
    string type = 2;
}

message SchemaColumnsResponse {
    int32 code = 1;
    string message = 2;
    repeated ColumnInfo columns = 3;
}

// ==================== 场景集 ====================

message SceneGroupItem {
    uint64 id = 1;
    string name = 2;
    string description = 3;
    string page_key = 4;
    uint64 datasource_id = 5;
    string source_table = 6;
    repeated string dimension_fields = 7;
    int32 status = 8;
}

message GetGroupByPageKeyRequest {
    string page_key = 1; // @gotags: form:"page_key"
}

message GetGroupByPageKeyResponse {
    int32 code = 1;
    string message = 2;
    SceneGroupItem group = 3;
}

message CreateGroupRequest {
    string name = 1;
    string description = 2;
    string page_key = 3;
    uint64 datasource_id = 4;
    string source_table = 5;
    repeated string dimension_fields = 6;
}

message CreateGroupResponse {
    int32 code = 1;
    string message = 2;
    uint64 group_id = 3;
}

message UpdateGroupRequest {
    uint64 group_id = 1;
    optional string name = 2;
    optional string description = 3;
    optional string source_table = 4;
    optional uint64 datasource_id = 5;
    optional int32 status = 6;
    repeated string dimension_fields = 7;
}

message GroupIDRequest {
    uint64 group_id = 1;
}

message ListGroupsResponse {
    int32 code = 1;
    string message = 2;
    repeated SceneGroupItem list = 3;
}

message GetDimensionValuesRequest {
    uint64 group_id = 1;   // @gotags: form:"group_id"
    string field_name = 2; // @gotags: form:"field_name"
}

message GetDimensionValuesResponse {
    int32 code = 1;
    string message = 2;
    repeated string values = 3;
}
