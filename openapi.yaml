components:
    schemas:
        api.basic_info_config.v1.BasicInfoConfig:
            type: object
            properties:
                name:
                    type: string
                    description: 算子名称
                version:
                    type: string
                    description: 算子版本
                script:
                    type: string
                    description: 算子脚本
                report1:
                    type: string
                    description: 报告1
                report2:
                    type: string
                    description: 报告2
                report3:
                    type: string
                    description: 报告3
                moduleType:
                    type: string
                    description: 模块类型
                swVersionStart:
                    type: string
                    description: 软件版本开始
                swVersionEnd:
                    type: string
                    description: 软件版本结束
                description:
                    type: string
                    description: 描述
                isEncrypted:
                    type: boolean
                    description: 是否加密
                team:
                    type: string
                    description: 团队
                algorithmType:
                    type: string
                    description: 算法类型
                tag:
                    type: string
                    description: 标签
                eventList:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.basic_info_config.v1.Event'
                    description: 事件列表
                chineseName:
                    type: string
                    description: 中文名称
                owner:
                    type: string
                    description: 负责人
                operatorType:
                    type: string
                    description: 算子类型
            description: 算子基础信息配置
        api.basic_info_config.v1.CreateBasicInfoConfigRequest:
            type: object
            properties:
                config:
                    allOf:
                        - $ref: '#/components/schemas/api.basic_info_config.v1.BasicInfoConfig'
                    description: 算子基础信息配置
            description: 创建算子基础信息请求
        api.basic_info_config.v1.CreateBasicInfoConfigResponse:
            type: object
            properties:
                code:
                    type: integer
                    description: 响应码
                    format: int32
                message:
                    type: string
                    description: 响应消息
                data:
                    $ref: '#/components/schemas/api.basic_info_config.v1.CreateBasicInfoConfigResponse_Data'
